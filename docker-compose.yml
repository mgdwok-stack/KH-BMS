version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: bidbot-postgres
    environment:
      POSTGRES_USER: bidbot
      POSTGRES_PASSWORD: bidbot_password
      POSTGRES_DB: bidbot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bidbot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bidbot-network

  # Redis (for Celery)
  redis:
    image: redis:7-alpine
    container_name: bidbot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bidbot-network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bidbot-backend
    environment:
      - DATABASE_URL=postgresql://bidbot:bidbot_password@postgres:5432/bidbot_db
      - REDIS_URL=redis://redis:6379/0
      - PROCUREMENT_API_KEY=${PROCUREMENT_API_KEY}
      - DEBUG=True
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./models:/app/models
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - bidbot-network

  # Celery Worker (for background tasks)
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bidbot-celery-worker
    environment:
      - DATABASE_URL=postgresql://bidbot:bidbot_password@postgres:5432/bidbot_db
      - REDIS_URL=redis://redis:6379/0
      - PROCUREMENT_API_KEY=${PROCUREMENT_API_KEY}
    volumes:
      - ./backend:/app
      - ./models:/app/models
      - ./logs:/app/logs
    depends_on:
      - postgres
      - redis
    command: celery -A app.tasks.scheduler worker --loglevel=info
    networks:
      - bidbot-network

  # Celery Beat (for scheduling)
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bidbot-celery-beat
    environment:
      - DATABASE_URL=postgresql://bidbot:bidbot_password@postgres:5432/bidbot_db
      - REDIS_URL=redis://redis:6379/0
      - PROCUREMENT_API_KEY=${PROCUREMENT_API_KEY}
    volumes:
      - ./backend:/app
      - ./logs:/app/logs
    depends_on:
      - postgres
      - redis
    command: celery -A app.tasks.scheduler beat --loglevel=info
    networks:
      - bidbot-network

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bidbot-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - bidbot-network

volumes:
  postgres_data:
  redis_data:

networks:
  bidbot-network:
    driver: bridge
