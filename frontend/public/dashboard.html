<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bid-Bot Clone - 실제 입찰 데이터 대시보드</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            text-align: center;
        }

        .header h1 {
            color: #2d3748;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: #718096;
            font-size: 1.1em;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-card h3 {
            color: #718096;
            font-size: 0.9em;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .stat-card .value {
            color: #2d3748;
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-card .label {
            color: #4299e1;
            font-size: 0.9em;
        }

        .data-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .data-section h2 {
            color: #2d3748;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e2e8f0;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background-color: #f7fafc;
            color: #2d3748;
            font-weight: 600;
        }

        tr:hover {
            background-color: #f7fafc;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #718096;
        }

        .spinner {
            border: 4px solid #e2e8f0;
            border-top: 4px solid #4299e1;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background-color: #fed7d7;
            color: #c53030;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filters input, .filters select, .filters button {
            padding: 10px 15px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1em;
        }

        .filters button {
            background: #4299e1;
            color: white;
            border: none;
            cursor: pointer;
            transition: background 0.3s;
        }

        .filters button:hover {
            background: #3182ce;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: 500;
        }

        .badge-success {
            background: #c6f6d5;
            color: #22543d;
        }

        .badge-info {
            background: #bee3f8;
            color: #2c5282;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🎯 Bid-Bot Clone</h1>
            <p>실제 입찰 데이터 분석 대시보드</p>
        </div>

        <!-- Loading -->
        <div id="loading" class="data-section loading">
            <div class="spinner"></div>
            <p>데이터를 불러오는 중...</p>
        </div>

        <!-- Error -->
        <div id="error" class="error" style="display: none;"></div>

        <!-- Stats Grid -->
        <div id="stats-grid" class="stats-grid" style="display: none;"></div>

        <!-- Bid List Section -->
        <div id="bid-list-section" class="data-section" style="display: none;">
            <h2>📋 입찰 공고 목록</h2>
            
            <!-- Filters -->
            <div class="filters">
                <input type="text" id="region-filter" placeholder="지역 (예: 서울)">
                <input type="text" id="industry-filter" placeholder="업종 (예: 토목건축공사)">
                <input type="number" id="min-price" placeholder="최소 금액">
                <input type="number" id="max-price" placeholder="최대 금액">
                <button onclick="loadBids()">🔍 검색</button>
                <button onclick="clearFilters()">🔄 초기화</button>
            </div>

            <div class="table-container">
                <table id="bid-table">
                    <thead>
                        <tr>
                            <th>공고번호</th>
                            <th>공고명</th>
                            <th>기관</th>
                            <th>지역</th>
                            <th>업종</th>
                            <th>기초금액</th>
                            <th>상태</th>
                        </tr>
                    </thead>
                    <tbody id="bid-tbody"></tbody>
                </table>
            </div>
        </div>

        <!-- Regional Stats -->
        <div id="regional-stats-section" class="data-section" style="display: none;">
            <h2>🗺️ 지역별 통계</h2>
            <div class="table-container">
                <table id="regional-table">
                    <thead>
                        <tr>
                            <th>지역</th>
                            <th>공고 수</th>
                            <th>평균 기초금액</th>
                            <th>평균 사정률</th>
                        </tr>
                    </thead>
                    <tbody id="regional-tbody"></tbody>
                </table>
            </div>
        </div>

        <!-- Industry Stats -->
        <div id="industry-stats-section" class="data-section" style="display: none;">
            <h2>🏭 업종별 통계</h2>
            <div class="table-container">
                <table id="industry-table">
                    <thead>
                        <tr>
                            <th>업종</th>
                            <th>공고 수</th>
                            <th>평균 기초금액</th>
                            <th>평균 사정률</th>
                        </tr>
                    </thead>
                    <tbody id="industry-tbody"></tbody>
                </table>
            </div>
        </div>

        <!-- Institution Stats (NEW!) -->
        <div id="institution-stats-section" class="data-section" style="display: none;">
            <h2>🏛️ 발주기관별 낙찰정보</h2>
            <p style="color: #718096; margin-bottom: 20px;">
                한국전력공사, 한국도로공사 등 주요 공공기관의 입찰 및 낙찰 통계
            </p>
            <div class="table-container">
                <table id="institution-table">
                    <thead>
                        <tr>
                            <th>발주기관</th>
                            <th>공고 수</th>
                            <th>평균 기초금액</th>
                            <th>평균 사정률</th>
                            <th>주요 업종</th>
                        </tr>
                    </thead>
                    <tbody id="institution-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Sandbox environment: use absolute URL
        const API_BASE_URL = 'https://8000-ibl1wp19duywhz06v6jkp-5c13a017.sandbox.novita.ai';

        async function fetchAPI(endpoint) {
            const url = `${API_BASE_URL}${endpoint}`;
            console.log('Fetching:', url);
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            return await response.json();
        }

        function showError(message) {
            document.getElementById('error').style.display = 'block';
            document.getElementById('error').textContent = `오류: ${message}`;
            document.getElementById('loading').style.display = 'none';
        }

        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }

        async function loadStats() {
            try {
                const summary = await fetchAPI('/api/v1/analytics/summary');
                
                const statsHTML = `
                    <div class="stat-card">
                        <h3>총 입찰 공고</h3>
                        <div class="value">${summary.total_stats.total_announcements.toLocaleString()}</div>
                        <div class="label">건</div>
                    </div>
                    <div class="stat-card">
                        <h3>낙찰 결과</h3>
                        <div class="value">${summary.total_stats.total_results.toLocaleString()}</div>
                        <div class="label">${summary.total_stats.success_rate}% 성공률</div>
                    </div>
                    <div class="stat-card">
                        <h3>평균 기초금액</h3>
                        <div class="value">${summary.total_stats.avg_basis_prc_display}</div>
                        <div class="label">평균</div>
                    </div>
                    <div class="stat-card">
                        <h3>평균 사정률</h3>
                        <div class="value">${summary.prediction_rate_stats.avg_prdprc_rate}%</div>
                        <div class="label">${summary.prediction_rate_stats.min_prdprc_rate}% ~ ${summary.prediction_rate_stats.max_prdprc_rate}%</div>
                    </div>
                `;
                
                document.getElementById('stats-grid').innerHTML = statsHTML;
                document.getElementById('stats-grid').style.display = 'grid';
            } catch (error) {
                showError('통계 데이터를 불러올 수 없습니다: ' + error.message);
            }
        }

        async function loadBids() {
            try {
                const region = document.getElementById('region-filter').value;
                const industry = document.getElementById('industry-filter').value;
                const minPrice = document.getElementById('min-price').value;
                const maxPrice = document.getElementById('max-price').value;

                let url = '/api/v1/bids/?page=1&page_size=20';
                if (region) url += `&region=${encodeURIComponent(region)}`;
                if (industry) url += `&industry=${encodeURIComponent(industry)}`;
                if (minPrice) url += `&min_price=${minPrice}`;
                if (maxPrice) url += `&max_price=${maxPrice}`;

                const data = await fetchAPI(url);
                
                const tbody = document.getElementById('bid-tbody');
                tbody.innerHTML = data.items.map(bid => `
                    <tr>
                        <td>${bid.bid_ntce_no}</td>
                        <td>${bid.bid_ntce_nm}</td>
                        <td>${bid.ntce_instt_nm}</td>
                        <td>${bid.dminstt_nm}</td>
                        <td>${bid.industry_ty_nm}</td>
                        <td>${bid.basis_prc_display}</td>
                        <td><span class="badge badge-success">${bid.bid_status}</span></td>
                    </tr>
                `).join('');

                document.getElementById('bid-list-section').style.display = 'block';
            } catch (error) {
                showError('입찰 데이터를 불러올 수 없습니다: ' + error.message);
            }
        }

        async function loadRegionalStats() {
            try {
                const data = await fetchAPI('/api/v1/analytics/regional');
                
                const tbody = document.getElementById('regional-tbody');
                tbody.innerHTML = data.regions.slice(0, 10).map(region => `
                    <tr>
                        <td><strong>${region.region}</strong></td>
                        <td>${region.count}건</td>
                        <td>${region.avg_basis_prc_display}</td>
                        <td><span class="badge badge-info">${region.avg_prdprc_rate}%</span></td>
                    </tr>
                `).join('');

                document.getElementById('regional-stats-section').style.display = 'block';
            } catch (error) {
                showError('지역별 통계를 불러올 수 없습니다: ' + error.message);
            }
        }

        async function loadIndustryStats() {
            try {
                const data = await fetchAPI('/api/v1/analytics/industry');
                
                const tbody = document.getElementById('industry-tbody');
                tbody.innerHTML = data.industries.slice(0, 10).map(industry => `
                    <tr>
                        <td><strong>${industry.industry}</strong></td>
                        <td>${industry.count}건</td>
                        <td>${industry.avg_basis_prc_display}</td>
                        <td><span class="badge badge-info">${industry.avg_prdprc_rate}%</span></td>
                    </tr>
                `).join('');

                document.getElementById('industry-stats-section').style.display = 'block';
            } catch (error) {
                showError('업종별 통계를 불러올 수 없습니다: ' + error.message);
            }
        }

        async function loadInstitutionStats() {
            try {
                const data = await fetchAPI('/api/v1/analytics/institution');
                
                // 토목/건설 관련 주요 기관 강조
                const majorInstitutions = [
                    '한국전력공사', '한국도로공사', '한국철도공사', 
                    '한국수자원공사', '한국토지주택공사', 
                    '국토교통부', '행정안전부', '환경부'
                ];
                
                const tbody = document.getElementById('institution-tbody');
                tbody.innerHTML = data.institutions.map((inst, index) => {
                    const isMajor = majorInstitutions.some(major => inst.institution.includes(major));
                    const rowClass = isMajor ? 'style="background-color: #fff5f5;"' : '';
                    const institutionDisplay = isMajor 
                        ? `<strong style="color: #c53030;">⭐ ${inst.institution}</strong>`
                        : `<strong>${inst.institution}</strong>`;
                    
                    // 주요 업종 표시 (임시로 '토목/건설' 표시)
                    const mainIndustry = isMajor ? '토목/건설 위주' : '다양';
                    
                    return `
                        <tr ${rowClass}>
                            <td>${institutionDisplay}</td>
                            <td>${inst.count}건</td>
                            <td>${inst.avg_basis_prc_display}</td>
                            <td><span class="badge badge-info">${inst.avg_prdprc_rate}%</span></td>
                            <td><span class="badge badge-success">${mainIndustry}</span></td>
                        </tr>
                    `;
                }).join('');

                document.getElementById('institution-stats-section').style.display = 'block';
            } catch (error) {
                showError('발주기관별 통계를 불러올 수 없습니다: ' + error.message);
            }
        }

        function clearFilters() {
            document.getElementById('region-filter').value = '';
            document.getElementById('industry-filter').value = '';
            document.getElementById('min-price').value = '';
            document.getElementById('max-price').value = '';
            loadBids();
        }

        // Initialize
        async function init() {
            try {
                await loadStats();
                await loadBids();
                await loadRegionalStats();
                await loadIndustryStats();
                await loadInstitutionStats();  // 발주기관별 통계 추가!
                hideLoading();
            } catch (error) {
                showError('데이터를 불러오는 중 오류가 발생했습니다: ' + error.message);
            }
        }

        // Load data on page load
        init();
    </script>
</body>
</html>
